# Builds WhereInTheWorld for Windows, Linux and Android and publishes a GitHub release.
# Trigger: push a tag like v1.0.1 (the version in tauri.conf.json must match).
#
# Android signing needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of whereintheworld-release.jks
#   ANDROID_KEYSTORE_PASSWORD keystore (and key) password
#   ANDROID_KEY_ALIAS         key alias (whereintheworld)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "WhereInTheWorld ${GITHUB_REF_NAME#v}"
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # the action's default ("tools platform-tools") fails: 'tools' no longer exists
          packages: platform-tools ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty"; exit 1; fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/whereintheworld-release.jks"
          ls -l "$RUNNER_TEMP/whereintheworld-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/whereintheworld-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME  NDK_HOME=$NDK_HOME"
          ls "$NDK_HOME" >/dev/null
          npx tauri android build --apk
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "WhereInTheWorld_${VERSION}_android.apk"
          gh release upload "$GITHUB_REF_NAME" "WhereInTheWorld_${VERSION}_android.apk" --clobber

  publish:
    needs: [create-release, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
