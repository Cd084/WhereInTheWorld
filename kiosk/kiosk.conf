# WhereInTheWorld kiosk settings (read by the X session at login).
# Tautulli, server and display options are set inside the app (gear icon).
# After editing: sudo systemctl restart getty@tty1   (or reboot)

# Whole-number UI scaling for high-DPI screens. Surface Pro: 2. A 1080p screen: 1.
# Fine-tune text size in the app's Settings → Display → Text size.
GDK_SCALE=2

# Screen rotation: normal, left, right or inverted (empty = leave as is).
ROTATE=""

# Optional backlight-off hours (24h clock), e.g. SCREEN_OFF="23:30" SCREEN_ON="07:00".
SCREEN_OFF=""
SCREEN_ON=""

# Works around blank windows on some Intel/older GPUs. Set to 0 to try hardware buffers.
WEBKIT_DISABLE_DMABUF_RENDERER=1
